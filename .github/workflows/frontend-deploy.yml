name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'stepin/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stepin/package-lock.json
      
      - name: Install dependencies
        working-directory: stepin
        run: npm ci
        
      - name: Build Next.js app
        working-directory: stepin
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      
      - name: Deploy to Azure Static Web Apps
        if: github.ref == 'refs/heads/main'
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: "/stepin" 
          output_location: ".next"
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      
      - name: Comment deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Deploy Preview Available
            📦 Azure Static Web Apps: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN && 'Configured' || 'Not Configured' }}
            
            The frontend will be deployed to Azure when merged to main.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              body: output
            })